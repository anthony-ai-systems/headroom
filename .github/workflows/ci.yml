name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly canary: the desktop job builds against moving upstream surfaces
    # (macos-14 runner image, Tauri toolchain); a scheduled run catches drift
    # without waiting for the next code push.
    - cron: "23 10 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Python engine (3.13 / Linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.13.12"
      - name: Verify the single release version
        run: |
          uv run --python 3.13.12 python scripts/release-version.py --check
          uv run --python 3.13.12 python scripts/updater_release.py --check-config
      - name: Compile Python sources
        run: uv run --python 3.13.12 python -m compileall -q headroom
      - name: Run the complete engine suite
        run: >-
          env PATH="$PWD/tests/fixtures/bin:$PATH"
          uv run --python 3.13.12 python -m unittest discover -s tests

  changes:
    name: Detect desktop-relevant changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      # Fallback 'true': on schedule/workflow_dispatch the filter step is
      # skipped and the desktop job must always run.
      desktop: ${{ steps.filter.outputs.desktop || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          # 'every' + negated globs: desktop is relevant unless a changed file
          # matches ALL the exclusions, i.e. doc/marketing-only diffs skip the
          # 10x-billed macOS build. Everything else (engine, scripts, menubar,
          # VERSION, workflows, ...) still triggers it.
          predicate-quantifier: every
          filters: |
            desktop:
              - '!docs/**'
              - '!marketing/**'
              - '!**/*.md'
              - '!LICENSE'

  desktop:
    name: Unsigned desktop tracer (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    needs: changes
    # Skipping still satisfies the required "Unsigned desktop tracer (macOS)"
    # context (a skipped job reports as passing to branch protection); a
    # workflow-level paths: filter would instead leave it "Expected" forever.
    if: needs.changes.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.13.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/menubar/package-lock.json
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Verify the single release version
        id: release-version
        run: |
          uv run --python 3.13.12 python scripts/release-version.py --check
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "target=$(rustc --print host-tuple)" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test the frozen sidecar
        run: scripts/build-desktop-sidecar.sh
      - name: Test the private bridge
        run: uv run --python 3.13.12 python -m unittest tests.test_desktop_bridge
      - name: Install pinned accessibility test dependencies
        run: npm ci --prefix integrations/menubar --ignore-scripts
      - name: Test the frontend state boundary
        run: npm --prefix integrations/menubar test
      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path integrations/menubar/src-tauri/Cargo.toml
      - name: Test the native shell
        run: cargo test --locked --manifest-path integrations/menubar/src-tauri/Cargo.toml
      - name: Build the unsigned app
        working-directory: integrations/menubar
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles app
      - name: Archive the unsigned tracer
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          integrations/menubar/src-tauri/target/release/bundle/macos/Headroom.app
          Headroom-${{ steps.release-version.outputs.version }}-${{ steps.release-version.outputs.target }}-unsigned.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Headroom-${{ steps.release-version.outputs.version }}-${{ steps.release-version.outputs.target }}-unsigned
          path: Headroom-${{ steps.release-version.outputs.version }}-${{ steps.release-version.outputs.target }}-unsigned.zip
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action requires a GITLEAKS_LICENSE on organization-owned
      # repos; the gitleaks CLI itself is MIT-licensed, so run it directly.
      - name: Run gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .
